name: signal-scan

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут запускается «смена» бота
  workflow_dispatch: {}      # ручной запуск кнопкой "Run workflow"

# Одна смена работает ~55 минут, следующая ждёт своей очереди и подхватывает.
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Восстановить память бота
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Запустить бота
        env:
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          RUN_SECONDS: "3300"
        run: python scanner.py

      - name: Сохранить память бота
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
